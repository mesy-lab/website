name: Deploy MESY Lab website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'schedule' || vars.GALLERY_SYNC_MODE == 'google-drive-api' || vars.STUDENTS_SYNC_MODE == 'google-drive-api'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test Gallery import
        run: npm run test:gallery

      - name: Test Students import
        run: npm run test:students

      - name: Import published Gallery posts from Drive
        if: vars.GALLERY_SYNC_MODE == 'google-drive-api'
        run: npm run gallery:sync:drive
        env:
          GALLERY_DRIVE_SERVICE_ACCOUNT: ${{ secrets.GALLERY_DRIVE_SERVICE_ACCOUNT }}

      - name: Import published Student profiles from Drive
        if: vars.STUDENTS_SYNC_MODE == 'google-drive-api'
        run: npm run students:sync:drive
        env:
          STUDENTS_DRIVE_SERVICE_ACCOUNT: ${{ secrets.STUDENTS_DRIVE_SERVICE_ACCOUNT || secrets.GALLERY_DRIVE_SERVICE_ACCOUNT }}

      - name: Build Vite site
        run: npm run build
        env:
          VITE_BASE_PATH: /website/

      - name: Generate route entry pages
        run: node scripts/generate-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
